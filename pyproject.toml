[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isa-aero"
version = "1.0.0"
description = "ISA atmosphere and aerodynamics utilities: layered standard atmosphere model, airspeed conversions, and basic aero quantities"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sajid Kabir Saji" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["isa", "atmosphere", "aerodynamics", "aerospace", "airspeed", "flight"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/sajidkabir/isa-aero"
Repository = "https://github.com/sajidkabir/isa-aero"
Issues = "https://github.com/sajidkabir/isa-aero/issues"
Changelog = "https://github.com/sajidkabir/isa-aero/blob/main/CHANGELOG.md"

[project.scripts]
isa-aero = "isa_aero.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/isa_aero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
